<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCXコントローラープリセット制御</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="icon" href="data:,">
    <style>
        .preset-button {
            margin: 5px;
            min-width: 150px;
        }
        .active-preset {
            background-color: #28a745 !important;
            color: white !important;
        }
        .error-message {
            color: #dc3545;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">MCXコントローラープリセット制御</h1>
        
        <div id="error-message">
            {% if error_message %}
            <div class="error-message alert alert-danger">
                {{ error_message }}
            </div>
            {% endif %}
        </div>

        <ul class="nav nav-tabs mb-4" id="presetTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="one-to-one-tab" data-bs-toggle="tab" data-bs-target="#one-to-one" type="button" role="tab">1対1接続プリセット</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="n-to-one-tab" data-bs-toggle="tab" data-bs-target="#n-to-one" type="button" role="tab">N対1接続プリセット</button>
            </li>
        </ul>

        <div class="tab-content" id="presetTabsContent">
            <div class="tab-pane fade show active" id="one-to-one" role="tabpanel">
                <div class="d-flex flex-wrap">
                    {% for preset in one_to_one_presets %}
                    <button class="btn btn-outline-primary preset-button {% if preset == current_preset %}active-preset{% endif %}"
                            hx-post="/load_preset"
                            hx-vals='{"preset_name": "{{ preset }}"}'
                            hx-target="#error-message"
                            hx-swap="innerHTML">
                        {{ mcx.get_preset_display_name(preset) }}
                    </button>
                    {% endfor %}
                </div>
            </div>
            <div class="tab-pane fade" id="n-to-one" role="tabpanel">
                <div class="d-flex flex-wrap">
                    {% for preset in n_to_one_presets %}
                    <button class="btn btn-outline-primary preset-button {% if preset == current_preset %}active-preset{% endif %}"
                            hx-post="/load_preset"
                            hx-vals='{"preset_name": "{{ preset }}"}'
                            hx-target="#error-message"
                            hx-swap="innerHTML">
                        {{ mcx.get_preset_display_name(preset) }}
                    </button>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
