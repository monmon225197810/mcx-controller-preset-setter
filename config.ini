; -*- coding: utf-8 -*-

[MCX_CONTROLLER]
ip_address = 192.168.1.100
port = 6980
security_key = abc123
timeout = 5
polling_interval = 10

[ERROR_MESSAGES]
timeout = "MCXコントローラーとの通信がタイムアウトしました"
connection_error = "MCXコントローラーへの接続に失敗しました"
preset_error = "プリセット '{preset_name}' の設定に失敗しました"

[PRESETS]
# 1対1接続プリセット
one_to_one = preset1, preset2, preset3

# N対1接続プリセット
n_to_one = preset4, preset5, preset6

[PRESET_NAMES]
# プリセット名と表示名のマッピング
preset1 = 会議室A
preset2 = 会議室B
preset3 = 会議室C
preset4 = マルチディスプレイ1
preset5 = マルチディスプレイ2
preset6 = マルチディスプレイ3 